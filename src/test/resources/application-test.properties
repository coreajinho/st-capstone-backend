# ==========================================
# Test Profile Configuration
# ==========================================

# ==========================================
# Server Configuration (Test)
# ==========================================
server.port=0

# ==========================================
# Logging Configuration (Test)
# ==========================================
logging.level.root=INFO
logging.level.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.example.stcapstonebackend.debate=DEBUG
logging.level.org.example.stcapstonebackend.debate.scheduler=DEBUG

# ==========================================
# Database Configuration (Test - H2 In-Memory)
# ==========================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true

# ==========================================
# JPA & Hibernate Configuration (Test)
# ==========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true

# Flyway disabled for tests
spring.flyway.enabled=false

# ==========================================
# JWT Configuration (Test)
# ==========================================
jwt.secret=testSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS256AlgorithmInTestEnvironment
jwt.expiration=86400000

# ==========================================
# Riot API Configuration (Test - Mock values)
# ==========================================
riot.api.key=TEST-API-KEY-FOR-TESTING-PURPOSES-ONLY
riot.api.url.kr=https://kr.api.riotgames.com
riot.api.url.asia=https://asia.api.riotgames.com

# ==========================================
# CORS Configuration (Test)
# ==========================================
app.cors.allowed-origins=http://localhost:3000

# ==========================================
# Business Logic Configuration (Test Override)
# ==========================================
# ??? ??: ?? ?? ?? ??
debate.expiration=PT24H

# ??? ??: ?? ?? ?? ????? (5??? ??)
debate.expiration-override=PT5M

# ??? ??: ???? ?? ?? (10?)
scheduler.match-check-interval-override=10000

# ???? ?? ??
scheduler.match-check-interval=60000

# ?? ?? ? ?? ?? (1??)
debate.pending-extension-duration=PT1H

# ? ?? ???? (10?)
match.timeout=PT10M

