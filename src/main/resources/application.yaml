spring:
  application:
    name: st-capstone-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT}
  error:
    whitelabel:
      enabled: false

logging:
  level:
    springframework: ${LOGGING_LEVEL}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Riot API Configuration
riot:
  api:
    key: ${RIOT_API_KEY}
    url:
      kr: ${RIOT_API_URL_KR}
      asia: ${RIOT_API_URL_ASIA}

# Custom App Configuration (CORS)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Scheduler Configuration
scheduler:
  match-check-interval: ${MATCH_CHECK_INTERVAL}

# Business Logic Configuration
debate:
  # 토론 만료 시간 (ISO-8601 Duration 형식)
  expiration: ${DEBATE_EXPIRATION}
  # 토론 보류 후 자동 만료 시간 (ISO-8601 Duration 형식, 기본 1시간)
  pending-extension-duration: ${DEBATE_PENDING_EXTENSION_DURATION:PT1H}

# 매치 타임아웃 시간 (ISO-8601 Duration 형식)
match:
  timeout: ${MATCH_TIMEOUT}

