spring.application.name=st-capstone-backend
server.error.whitelabel.enabled=false

# ==========================================
# Server Configuration
# ==========================================
server.port=${SERVER_PORT}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.springframework=${LOGGING_LEVEL}

# ==========================================
# Database Configuration
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true

# Flyway
spring.flyway.enabled=false

# ==========================================
# JWT Configuration
# ==========================================
# ???? JWT_SECRET? ??????.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================================
# Riot API Configuration
# ==========================================
riot.api.key=${RIOT_API_KEY}
riot.api.url.kr=${RIOT_API_URL_KR}
riot.api.url.asia=${RIOT_API_URL_ASIA}

# ==========================================
# Custom App Configuration (CORS)
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ==========================================
# Scheduler Configuration
# ==========================================
scheduler.match-check-interval=${MATCH_CHECK_INTERVAL}

# ==========================================
# Business Logic Configuration
# ==========================================
# ?? ??? ?? ?? ?? (ISO-8601 Duration ??)
debate.expiration=${DEBATE_EXPIRATION}
# ?? ?? ? ?? ?? (ISO-8601 Duration ??, ?? 1??)
debate.pending-extension-duration=${DEBATE_PENDING_EXTENSION_DURATION:PT1H}
# ?? ???? ?? (ISO-8601 Duration ??)
match.timeout=${MATCH_TIMEOUT}